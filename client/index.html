<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Lobby System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .main-menu, .lobby-view, .create-lobby {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            display: none;
        }

        .main-menu.active, .lobby-view.active, .create-lobby.active {
            display: block;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
        }

        .player-info {
            background: #f8f9fa;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            color: #666;
        }

        .search-section {
            margin-bottom: 30px;
        }

        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .search-bar input {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .search-bar input:focus {
            outline: none;
            border-color: #667eea;
        }

        .search-bar button {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }

        .search-bar button:hover {
            background: #5a67d8;
        }

        .lobby-actions {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: #48bb78;
            color: white;
        }

        .btn-success:hover {
            background: #38a169;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(72, 187, 120, 0.4);
        }

        .btn-danger {
            background: #fc8181;
            color: white;
        }

        .btn-danger:hover {
            background: #f56565;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(252, 129, 129, 0.4);
        }

        .btn-secondary {
            background: #a0aec0;
            color: white;
        }

        .btn-secondary:hover {
            background: #718096;
            transform: translateY(-2px);
        }

        .lobby-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .lobby-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s;
            cursor: pointer;
        }

        .lobby-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            border-color: #667eea;
        }

        .lobby-card h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .lobby-card .lobby-info {
            color: #666;
            font-size: 14px;
            margin: 5px 0;
        }

        .lobby-card .lobby-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 10px;
        }

        .status-open {
            background: #c6f6d5;
            color: #22543d;
        }

        .status-closed {
            background: #fed7d7;
            color: #742a2a;
        }

        .status-full {
            background: #fefcbf;
            color: #744210;
        }

        .status-private {
            background: #e9d8fd;
            color: #44337a;
        }

        .lobby-view .lobby-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .lobby-view .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .player-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border: 2px solid #e0e0e0;
        }

        .player-card .creator-badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            margin-top: 5px;
        }

        .lobby-actions-bar {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
        }

        .code-display {
            background: #f8f9fa;
            padding: 10px 20px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
            margin: 10px 0;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .pagination button {
            padding: 8px 15px;
            background: #e0e0e0;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .pagination button:hover {
            background: #667eea;
            color: white;
        }

        .pagination .active {
            background: #667eea;
            color: white;
        }

        .create-lobby .form-group {
            margin-bottom: 20px;
        }

        .create-lobby label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }

        .create-lobby input[type="text"],
        .create-lobby input[type="number"],
        .create-lobby select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .create-lobby input:focus,
        .create-lobby select:focus {
            outline: none;
            border-color: #667eea;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            z-index: 1000;
            animation: slideIn 0.3s ease;
            max-width: 400px;
        }

        .notification.success {
            background: #48bb78;
        }

        .notification.error {
            background: #fc8181;
        }

        .notification.info {
            background: #4299e1;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .lobby-grid {
                grid-template-columns: 1fr;
            }
            
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            
            .search-bar {
                flex-direction: column;
            }
            
            .lobby-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="mainMenu" class="main-menu active">
            <div class="header">
                <h1>🎮 Поиск лобби</h1>
                <div class="player-info">
                    Игрок: <span id="playerName">Гость</span>
                </div>
            </div>

            <div class="search-section">
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Поиск по названию лобби..." />
                    <button onclick="searchLobbies()">🔍 Поиск</button>
                    <button onclick="resetSearch()" class="btn-secondary">Сброс</button>
                </div>
                <div class="lobby-actions">
                    <button onclick="showCreateLobby()" class="btn btn-success">➕ Создать лобби</button>
                    <button onclick="refreshLobbies()" class="btn btn-secondary">🔄 Обновить</button>
                </div>
            </div>

            <div id="lobbyList">
                <div class="lobby-grid" id="lobbyGrid">
                    <!-- Лобби будут загружены сюда -->
                </div>
                <div class="pagination" id="pagination">
                    <!-- Пагинация -->
                </div>
            </div>
        </div>

        <div id="createLobby" class="create-lobby">
            <div class="header">
                <h1>Создание лобби</h1>
                <button onclick="hideCreateLobby()" class="btn btn-secondary">✕ Закрыть</button>
            </div>
            <div class="form-group">
                <label for="lobbyNameInput">Название лобби</label>
                <input type="text" id="lobbyNameInput" placeholder="Введите название..." />
            </div>
            <div class="form-group">
                <label for="maxPlayersInput">Максимум игроков</label>
                <input type="number" id="maxPlayersInput" min="2" max="8" value="4" />
            </div>
            <div class="form-group checkbox-group">
                <input type="checkbox" id="isPrivateInput" />
                <label for="isPrivateInput">Закрытое лобби (только по коду)</label>
            </div>
            <button onclick="createLobby()" class="btn btn-primary">Создать</button>
        </div>

        <div id="lobbyView" class="lobby-view">
            <div class="lobby-header">
                <div>
                    <h2 id="lobbyTitle">Название лобби</h2>
                    <div id="lobbyCodeDisplay" class="code-display" style="display:none;"></div>
                </div>
                <button onclick="leaveLobby()" class="btn btn-danger">🚪 Выйти из лобби</button>
            </div>

            <div>
                <h3>Игроки (<span id="playerCount">0</span>/<span id="maxPlayerCount">0</span>)</h3>
                <div class="players-grid" id="playersGrid">
                    <!-- Игроки будут загружены сюда -->
                </div>
            </div>

            <div class="lobby-actions-bar">
                <button id="startGameBtn" onclick="startGame()" class="btn btn-success">▶️ Начать игру</button>
                <button onclick="copyLobbyCode()" class="btn btn-secondary" id="copyCodeBtn" style="display:none;">📋 Скопировать код</button>
            </div>
        </div>
    </div>

    <script>
        // Конфигурация
        const WS_URL = 'https://minigames-eb2w.onrender.com';
        let ws = null;
        let currentPlayerId = null;
        let currentLobbyId = null;
        let currentPage = 0;
        let currentSearchQuery = '';

        // Инициализация
        document.addEventListener('DOMContentLoaded', () => {
            connectWebSocket();
        });

        // WebSocket соединение
        function connectWebSocket() {
            ws = new WebSocket(WS_URL);

            ws.onopen = () => {
                const playerName = prompt('Введите ваше имя:', 'Игрок ' + Math.floor(Math.random() * 1000));
                if (playerName) {
                    document.getElementById('playerName').textContent = playerName;
                    ws.send(JSON.stringify({
                        type: 'join',
                        name: playerName
                    }));
                }
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleWebSocketMessage(data);
            };

            ws.onclose = () => {
                showNotification('Соединение потеряно. Переподключение...', 'error');
                setTimeout(connectWebSocket, 3000);
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };
        }

        // Обработка WebSocket сообщений
        function handleWebSocketMessage(data) {
            switch (data.type) {
                case 'joined':
                    currentPlayerId = data.playerId;
                    renderLobbies(data.lobbies);
                    break;

                case 'lobbyList':
                    renderLobbies(data.lobbies);
                    break;

                case 'lobbyCreated':
                    currentLobbyId = data.lobby.id;
                    showLobbyView(data.lobby);
                    showNotification('Лобби успешно создано!', 'success');
                    break;

                case 'lobbyJoined':
                    currentLobbyId = data.lobby.id;
                    showLobbyView(data.lobby);
                    showNotification('Вы присоединились к лобби!', 'success');
                    break;

                case 'lobbyUpdate':
                    if (currentLobbyId === data.lobby.id) {
                        updateLobbyView(data.lobby);
                    }
                    break;

                case 'lobbyInfo':
                    updateLobbyView(data.lobby);
                    break;

                case 'leftLobby':
                    currentLobbyId = null;
                    showMainMenu();
                    showNotification('Вы вышли из лобби', 'info');
                    break;

                case 'gameStarted':
                    showNotification('Игра началась! 🎮', 'success');
                    // Здесь можно добавить переход в игровой экран
                    break;

                case 'searchResults':
                    renderSearchResults(data);
                    break;

                case 'error':
                    showNotification(data.message, 'error');
                    break;

                default:
                    console.log('Неизвестный тип сообщения:', data);
            }
        }

        // Отображение лобби
        function renderLobbies(lobbies) {
            const grid = document.getElementById('lobbyGrid');
            if (!lobbies || lobbies.length === 0) {
                grid.innerHTML = '<p style="text-align:center;color:#999;padding:40px;">Нет доступных лобби</p>';
                return;
            }

            grid.innerHTML = lobbies.map(lobby => `
                <div class="lobby-card" onclick="joinLobby(${lobby.id})">
                    <h3>${lobby.name}</h3>
                    <div class="lobby-info">👥 ${lobby.currentPlayers}/${lobby.maxPlayers}</div>
                    <div class="lobby-info">${lobby.isPrivate ? '🔒 Закрыто' : '🔓 Открыто'}</div>
                    ${lobby.isPrivate ? `<div class="lobby-info">Код: ${lobby.code}</div>` : ''}
                    <span class="lobby-status ${lobby.currentPlayers === lobby.maxPlayers ? 'status-full' : lobby.isPrivate ? 'status-private' : 'status-open'}">
                        ${lobby.currentPlayers === lobby.maxPlayers ? 'Заполнено' : lobby.isPrivate ? 'По коду' : 'Открыто'}
                    </span>
                </div>
            `).join('');
        }

        // Отображение результатов поиска
        function renderSearchResults(data) {
            const grid = document.getElementById('lobbyGrid');
            if (!data.lobbies || data.lobbies.length === 0) {
                grid.innerHTML = '<p style="text-align:center;color:#999;padding:40px;">Лобби не найдены</p>';
                return;
            }

            renderLobbies(data.lobbies);
            
            const totalPages = Math.ceil(data.total / 15);
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';
            
            for (let i = 0; i < totalPages; i++) {
                const btn = document.createElement('button');
                btn.textContent = i + 1;
                btn.className = i === data.page ? 'active' : '';
                btn.onclick = () => {
                    currentPage = i;
                    searchLobbies();
                };
                pagination.appendChild(btn);
            }
        }

        // Поиск лобби
        function searchLobbies() {
            const query = document.getElementById('searchInput').value;
            currentSearchQuery = query;
            currentPage = 0;
            
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'searchLobbies',
                    query: query,
                    page: currentPage
                }));
            }
        }

        function resetSearch() {
            document.getElementById('searchInput').value = '';
            currentSearchQuery = '';
            currentPage = 0;
            refreshLobbies();
        }

        function refreshLobbies() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'searchLobbies',
                    query: '',
                    page: 0
                }));
            }
        }

        // Присоединение к лобби
        function joinLobby(lobbyId) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                showNotification('Нет соединения с сервером', 'error');
                return;
            }

            const lobby = findLobbyById(lobbyId);
            if (lobby && lobby.isPrivate) {
                const code = prompt('Введите код доступа:');
                if (!code) return;
                ws.send(JSON.stringify({
                    type: 'joinLobby',
                    lobbyId: lobbyId,
                    code: code
                }));
            } else {
                ws.send(JSON.stringify({
                    type: 'joinLobby',
                    lobbyId: lobbyId
                }));
            }
        }

        // Поиск лобби по ID (для проверки)
        function findLobbyById(id) {
            // Здесь нужно получить данные из текущего списка
            // В реальном приложении лучше хранить кэш лобби
            return null;
        }

        // Создание лобби
        function createLobby() {
            const name = document.getElementById('lobbyNameInput').value.trim();
            const maxPlayers = document.getElementById('maxPlayersInput').value;
            const isPrivate = document.getElementById('isPrivateInput').checked;

            if (!name) {
                showNotification('Введите название лобби', 'error');
                return;
            }

            if (!ws || ws.readyState !== WebSocket.OPEN) {
                showNotification('Нет соединения с сервером', 'error');
                return;
            }

            ws.send(JSON.stringify({
                type: 'createLobby',
                lobbyName: name,
                maxPlayers: maxPlayers,
                isPrivate: isPrivate
            }));

            hideCreateLobby();
        }

        // Выход из лобби
        function leaveLobby() {
            if (confirm('Вы уверены, что хотите выйти из лобби?')) {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: 'leaveLobby'
                    }));
                }
            }
        }

        // Начать игру
        function startGame() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'startGame'
                }));
            }
        }

        // Показать лобби
        function showLobbyView(lobby) {
            document.getElementById('mainMenu').classList.remove('active');
            document.getElementById('createLobby').classList.remove('active');
            document.getElementById('lobbyView').classList.add('active');
            updateLobbyView(lobby);
        }

        // Обновить лобби
        function updateLobbyView(lobby) {
            document.getElementById('lobbyTitle').textContent = lobby.name;
            document.getElementById('playerCount').textContent = lobby.currentPlayers;
            document.getElementById('maxPlayerCount').textContent = lobby.maxPlayers;

            const codeDisplay = document.getElementById('lobbyCodeDisplay');
            if (lobby.isPrivate && lobby.code) {
                codeDisplay.textContent = '🔑 Код лобби: ' + lobby.code;
                codeDisplay.style.display = 'block';
                document.getElementById('copyCodeBtn').style.display = 'inline-block';
            } else {
                codeDisplay.style.display = 'none';
                document.getElementById('copyCodeBtn').style.display = 'none';
            }

            // Отображение игроков
            const grid = document.getElementById('playersGrid');
            grid.innerHTML = lobby.players.map(player => `
                <div class="player-card">
                    <div>${player.name}</div>
                    ${player.isCreator ? '<div class="creator-badge">👑 Создатель</div>' : ''}
                </div>
            `).join('');

            // Кнопка начала игры (только для создателя)
            const startBtn = document.getElementById('startGameBtn');
            if (lobby.creatorId === currentPlayerId && lobby.currentPlayers >= 2) {
                startBtn.style.display = 'inline-block';
                startBtn.disabled = lobby.isGameStarted;
                startBtn.textContent = lobby.isGameStarted ? 'Игра началась!' : '▶️ Начать игру';
            } else {
                startBtn.style.display = 'none';
            }
        }

        // Показать главное меню
        function showMainMenu() {
            document.getElementById('lobbyView').classList.remove('active');
            document.getElementById('createLobby').classList.remove('active');
            document.getElementById('mainMenu').classList.add('active');
            refreshLobbies();
        }

        // Показать создание лобби
        function showCreateLobby() {
            document.getElementById('mainMenu').classList.remove('active');
            document.getElementById('lobbyView').classList.remove('active');
            document.getElementById('createLobby').classList.add('active');
        }

        function hideCreateLobby() {
            document.getElementById('createLobby').classList.remove('active');
            document.getElementById('mainMenu').classList.add('active');
        }

        // Копирование кода
        function copyLobbyCode() {
            const code = document.getElementById('lobbyCodeDisplay').textContent.replace('🔑 Код лобби: ', '');
            navigator.clipboard.writeText(code).then(() => {
                showNotification('Код скопирован!', 'success');
            }).catch(() => {
                // Fallback
                const textarea = document.createElement('textarea');
                textarea.value = code;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showNotification('Код скопирован!', 'success');
            });
        }

        // Уведомления
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.style.opacity = '0';
                notification.style.transform = 'translateX(100%)';
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }

        // Периодическое обновление
        setInterval(() => {
            if (currentLobbyId && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'getLobbyInfo'
                }));
            }
        }, 5000);
    </script>
</body>
</html>
