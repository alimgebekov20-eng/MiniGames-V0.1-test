<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Lobby System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .main-menu, .lobby-view, .create-lobby, .game-view {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            display: none;
        }

        .main-menu.active, .lobby-view.active, .create-lobby.active, .game-view.active {
            display: block;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
        }

        .player-info {
            background: #f8f9fa;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            color: #666;
        }

        .search-section {
            margin-bottom: 30px;
        }

        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .search-bar input {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
            min-width: 150px;
        }

        .search-bar input:focus {
            outline: none;
            border-color: #667eea;
        }

        .search-bar button {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }

        .search-bar button:hover {
            background: #5a67d8;
        }

        .lobby-actions {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: #48bb78;
            color: white;
        }

        .btn-success:hover {
            background: #38a169;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(72, 187, 120, 0.4);
        }

        .btn-danger {
            background: #fc8181;
            color: white;
        }

        .btn-danger:hover {
            background: #f56565;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(252, 129, 129, 0.4);
        }

        .btn-secondary {
            background: #a0aec0;
            color: white;
        }

        .btn-secondary:hover {
            background: #718096;
            transform: translateY(-2px);
        }

        .btn-warning {
            background: #ed8936;
            color: white;
        }

        .btn-warning:hover {
            background: #dd6b20;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(237, 137, 54, 0.4);
        }

        .lobby-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .lobby-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s;
            cursor: pointer;
        }

        .lobby-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            border-color: #667eea;
        }

        .lobby-card h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .lobby-card .lobby-info {
            color: #666;
            font-size: 14px;
            margin: 5px 0;
        }

        .lobby-card .lobby-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 10px;
        }

        .status-open {
            background: #c6f6d5;
            color: #22543d;
        }

        .status-closed {
            background: #fed7d7;
            color: #742a2a;
        }

        .status-full {
            background: #fefcbf;
            color: #744210;
        }

        .status-private {
            background: #e9d8fd;
            color: #44337a;
        }

        .lobby-view .lobby-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .lobby-view .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .player-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border: 2px solid #e0e0e0;
        }

        .player-card .creator-badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            margin-top: 5px;
        }

        .lobby-actions-bar {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
            flex-wrap: wrap;
        }

        .code-display {
            background: #f8f9fa;
            padding: 10px 20px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
            margin: 10px 0;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .code-display .code-value {
            letter-spacing: 3px;
            font-size: 24px;
        }

        .code-display .hide-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 20px;
            padding: 5px 10px;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .code-display .hide-btn:hover {
            background: #e0e0e0;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .pagination button {
            padding: 8px 15px;
            background: #e0e0e0;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .pagination button:hover {
            background: #667eea;
            color: white;
        }

        .pagination .active {
            background: #667eea;
            color: white;
        }

        .create-lobby .form-group {
            margin-bottom: 20px;
        }

        .create-lobby label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }

        .create-lobby input[type="text"],
        .create-lobby input[type="number"],
        .create-lobby select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .create-lobby input:focus,
        .create-lobby select:focus {
            outline: none;
            border-color: #667eea;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            z-index: 1000;
            animation: slideIn 0.3s ease;
            max-width: 400px;
        }

        .notification.success {
            background: #48bb78;
        }

        .notification.error {
            background: #fc8181;
        }

        .notification.info {
            background: #4299e1;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Game View Styles */
        .game-view .game-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .game-view .game-header h1 {
            font-size: 32px;
            color: #333;
        }

        .game-view .game-header .game-mode {
            color: #667eea;
            font-size: 18px;
            margin-top: 5px;
        }

        .game-status {
            font-size: 20px;
            margin-top: 10px;
            color: #667eea;
            font-weight: bold;
        }

        .game-players {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
        }

        .game-players .player-roles {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .role-display {
            padding: 10px 20px;
            border-radius: 10px;
            border: 2px solid #667eea;
            background: white;
        }

        .role-display.setter {
            border-color: #667eea;
        }

        .role-display.guesser {
            border-color: #48bb78;
        }

        .role-display .role-label {
            font-weight: bold;
        }

        .color-palette {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        .color-btn {
            width: 60px;
            height: 60px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .color-btn:hover {
            transform: scale(1.1);
        }

        .color-btn:active {
            transform: scale(0.95);
        }

        .sequence-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
            min-height: 70px;
            flex-wrap: wrap;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 10px;
            border: 2px dashed #ccc;
        }

        .color-block {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            border: 3px solid #333;
            cursor: pointer;
            transition: all 0.3s;
        }

        .color-block:hover {
            transform: scale(1.1);
        }

        .color-block.correct {
            border-color: #2ecc71;
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.5);
        }

        .color-block.wrong {
            border-color: #e74c3c;
            box-shadow: 0 0 20px rgba(231, 76, 60, 0.5);
        }

        .color-block.wrong-position {
            border-color: #f1c40f;
            box-shadow: 0 0 20px rgba(241, 196, 15, 0.5);
        }

        .result-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin: 10px 0;
            padding: 10px;
            background: white;
            border-radius: 10px;
            flex-wrap: wrap;
        }

        .result-label {
            font-weight: bold;
            color: #333;
            min-width: 100px;
        }

        .winner-text {
            font-size: 36px;
            color: #f1c40f;
            text-shadow: 0 0 30px rgba(241, 196, 15, 0.5);
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .join-by-code {
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .join-by-code input {
            flex: 1;
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            min-width: 150px;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-family: monospace;
            font-size: 20px;
        }

        .join-by-code input:focus {
            outline: none;
            border-color: #667eea;
        }

        .game-mode-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .game-mode-modal.active {
            display: flex;
        }

        .game-mode-modal .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 400px;
            width: 90%;
        }

        .game-mode-modal .modal-content h2 {
            margin-bottom: 20px;
        }

        .game-mode-modal .modal-content .mode-btn {
            width: 100%;
            margin: 5px 0;
        }

        .remove-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            flex-wrap: wrap;
        }

        .remove-toggle .toggle-label {
            font-weight: 600;
            color: #333;
        }

        .remove-toggle .toggle-status {
            font-weight: 700;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 14px;
        }

        .toggle-status.on {
            background: #fc8181;
            color: white;
        }

        .toggle-status.off {
            background: #48bb78;
            color: white;
        }

        #gameContent {
            min-height: 400px;
        }

        @media (max-width: 768px) {
            .lobby-grid {
                grid-template-columns: 1fr;
            }
            
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .search-bar {
                flex-direction: column;
            }
            
            .lobby-actions {
                flex-direction: column;
            }

            .game-players .player-roles {
                flex-direction: column;
                align-items: center;
            }

            .color-palette {
                gap: 10px;
            }

            .color-btn {
                width: 50px;
                height: 50px;
            }

            .color-block {
                width: 50px;
                height: 50px;
            }

            .result-row {
                flex-direction: column;
                align-items: center;
            }

            .remove-toggle {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Главное меню -->
        <div id="mainMenu" class="main-menu active">
            <div class="header">
                <h1>🎮 Поиск лобби</h1>
                <div class="player-info">
                    Игрок: <span id="playerName">Гость</span>
                </div>
            </div>

            <div class="search-section">
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Поиск по названию лобби..." />
                    <button onclick="searchLobbies()">🔍 Поиск</button>
                    <button onclick="resetSearch()" class="btn-secondary">Сброс</button>
                </div>
                <div class="lobby-actions">
                    <button onclick="showCreateLobby()" class="btn btn-success">➕ Создать лобби</button>
                    <button onclick="refreshLobbies()" class="btn btn-secondary">🔄 Обновить</button>
                </div>
                
                <div class="join-by-code">
                    <span style="font-weight: 600; color: #333;">🔑 Войти по коду:</span>
                    <input type="text" id="joinCodeInput" placeholder="Введите код" maxlength="6" />
                    <button onclick="joinByCode()" class="btn btn-primary">Войти</button>
                </div>
            </div>

            <div id="lobbyList">
                <div class="lobby-grid" id="lobbyGrid"></div>
                <div class="pagination" id="pagination"></div>
            </div>
        </div>

        <!-- Создание лобби -->
        <div id="createLobby" class="create-lobby">
            <div class="header">
                <h1>Создание лобби</h1>
                <button onclick="hideCreateLobby()" class="btn btn-secondary">✕ Закрыть</button>
            </div>
            <div class="form-group">
                <label for="lobbyNameInput">Название лобби</label>
                <input type="text" id="lobbyNameInput" placeholder="Введите название..." />
            </div>
            <div class="form-group">
                <label for="maxPlayersInput">Максимум игроков</label>
                <input type="number" id="maxPlayersInput" min="2" max="8" value="4" />
            </div>
            <div class="form-group">
                <label for="gameModeSelect">Режим игры</label>
                <select id="gameModeSelect">
                    <option value="GuessSequence">🎯 Угадай последовательность</option>
                </select>
            </div>
            <div class="form-group checkbox-group">
                <input type="checkbox" id="isPrivateInput" />
                <label for="isPrivateInput">Закрытое лобби (только по коду)</label>
            </div>
            <button onclick="createLobby()" class="btn btn-primary">Создать</button>
        </div>

        <!-- Просмотр лобби -->
        <div id="lobbyView" class="lobby-view">
            <div class="lobby-header">
                <div>
                    <h2 id="lobbyTitle">Название лобби</h2>
                    <div id="lobbyCodeDisplay" class="code-display" style="display:none;">
                        <span>🔑 Код лобби:</span>
                        <span class="code-value" id="codeValue">------</span>
                        <button onclick="toggleCodeVisibility()" class="hide-btn" id="hideCodeBtn">👁️</button>
                        <button onclick="copyLobbyCode()" class="btn btn-secondary" style="padding: 5px 15px;">📋</button>
                    </div>
                </div>
                <button onclick="leaveLobby()" class="btn btn-danger">🚪 Выйти из лобби</button>
            </div>

            <div>
                <h3>Игроки (<span id="playerCount">0</span>/<span id="maxPlayerCount">0</span>)</h3>
                <div class="players-grid" id="playersGrid"></div>
            </div>

            <div class="lobby-actions-bar">
                <button id="startGameBtn" onclick="startGame()" class="btn btn-success">▶️ Начать игру</button>
            </div>
        </div>

        <!-- Игровой экран -->
        <div id="gameView" class="game-view">
            <div class="game-header">
                <h1 id="gameTitle">🎮 Игра</h1>
                <div class="game-mode" id="gameModeDisplay"></div>
                <div class="game-status" id="gameStatus"></div>
            </div>
            <div id="gameContent"></div>
            <div style="text-align: center; margin-top: 20px;">
                <button onclick="leaveGame()" class="btn btn-danger">🚪 Выйти из игры</button>
            </div>
        </div>
    </div>

    <script>
        // Конфигурация
        const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        const WS_URL = isLocal 
            ? 'ws://localhost:3000' 
            : 'wss://minigames-eb2w.onrender.com';

        let ws = null;
        let currentPlayerId = null;
        let currentLobbyId = null;
        let currentPage = 0;
        let currentSearchQuery = '';
        let codeVisible = true;
        let gameClient = null;
        let gameName = '';

        // Инициализация
        document.addEventListener('DOMContentLoaded', () => {
            connectWebSocket();
        });

        // WebSocket соединение
        function connectWebSocket() {
            ws = new WebSocket(WS_URL);

            ws.onopen = () => {
                let playerName = '';
                let validName = false;
                
                while (!validName) {
                    playerName = prompt('Введите ваше имя (только английские буквы и цифры, минимум 3 символа):', '');
                    if (playerName === null) {
                        playerName = 'Player' + Math.floor(Math.random() * 10000);
                        validName = true;
                    } else if (playerName.trim().length >= 3 && /^[a-zA-Z0-9]+$/.test(playerName.trim())) {
                        playerName = playerName.trim();
                        validName = true;
                    } else {
                        alert('Имя должно содержать минимум 3 символа (только английские буквы и цифры)');
                    }
                }
                
                document.getElementById('playerName').textContent = playerName;
                ws.send(JSON.stringify({
                    type: 'join',
                    name: playerName
                }));
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleWebSocketMessage(data);
            };

            ws.onclose = () => {
                showNotification('Соединение потеряно. Переподключение...', 'error');
                setTimeout(connectWebSocket, 3000);
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };
        }

        // Обработка WebSocket сообщений
        function handleWebSocketMessage(data) {
            switch (data.type) {
                case 'joined':
                    currentPlayerId = data.playerId;
                    document.getElementById('playerName').textContent = data.playerName || 'Гость';
                    renderLobbies(data.lobbies);
                    break;

                case 'lobbyList':
                    renderLobbies(data.lobbies);
                    break;

                case 'lobbyCreated':
                    currentLobbyId = data.lobby.id;
                    showLobbyView(data.lobby);
                    showNotification('Лобби успешно создано!', 'success');
                    break;

                case 'lobbyJoined':
                    currentLobbyId = data.lobby.id;
                    showLobbyView(data.lobby);
                    showNotification('Вы присоединились к лобби!', 'success');
                    setTimeout(() => {
                        if (ws && ws.readyState === WebSocket.OPEN && currentLobbyId) {
                            ws.send(JSON.stringify({
                                type: 'getLobbyInfo'
                            }));
                        }
                    }, 500);
                    break;

                case 'lobbyUpdate':
                    if (currentLobbyId === data.lobby.id) {
                        updateLobbyView(data.lobby);
                    }
                    break;

                case 'lobbyInfo':
                    updateLobbyView(data.lobby);
                    if (data.lobby.isGameStarted) {
                        setTimeout(() => {
                            if (ws && ws.readyState === WebSocket.OPEN && currentLobbyId) {
                                ws.send(JSON.stringify({
                                    type: 'getLobbyInfo'
                                }));
                            }
                        }, 300);
                    }
                    break;

                case 'leftLobby':
                    currentLobbyId = null;
                    showMainMenu();
                    showNotification('Вы вышли из лобби', 'info');
                    break;

                case 'gameStarted':
                    showGameView(data.lobby.gameMode);
                    showNotification('Игра началась! 🎮', 'success');
                    setTimeout(() => {
                        if (ws && ws.readyState === WebSocket.OPEN && currentLobbyId) {
                            ws.send(JSON.stringify({
                                type: 'getLobbyInfo'
                            }));
                        }
                    }, 500);
                    break;

                case 'gameState':
                    if (gameClient) {
                        gameClient.update(data.state);
                    }
                    break;

                case 'gameMessage':
                    showNotification(data.message, 'info');
                    break;

                case 'searchResults':
                    renderSearchResults(data);
                    break;

                case 'error':
                    showNotification(data.message, 'error');
                    break;

                default:
                    console.log('Неизвестный тип сообщения:', data);
            }
        }

        // Действие игры
        function gameAction(action, params = {}) {
            if (ws && ws.readyState === WebSocket.OPEN && currentLobbyId) {
                ws.send(JSON.stringify({
                    type: 'gameAction',
                    action: action,
                    params: params
                }));
            }
        }

        // Показать игровой вид
        function showGameView(gameMode) {
            document.getElementById('mainMenu').classList.remove('active');
            document.getElementById('lobbyView').classList.remove('active');
            document.getElementById('createLobby').classList.remove('active');
            document.getElementById('gameView').classList.add('active');
            
            document.getElementById('gameTitle').textContent = `🎮 ${gameMode || 'Игра'}`;
            document.getElementById('gameModeDisplay').textContent = `Режим: ${gameMode || 'Игра'}`;
            
            // Загружаем клиент игры
            gameName = gameMode || 'GuessSequence';
            loadGameClient(gameName);
        }

        // Загрузка клиента игры
        function loadGameClient(gameName) {
            // Пытаемся загрузить клиент игры динамически
            try {
                // Проверяем, есть ли уже загруженный клиент
                if (window[gameName + 'Client']) {
                    gameClient = new window[gameName + 'Client']();
                    const container = document.getElementById('gameContent');
                    gameClient.render(container, gameAction);
                    return;
                }
                
                // Загружаем скрипт клиента
                const script = document.createElement('script');
                script.src = `/games/${gameName}/${gameName}Client.js`;
                script.onload = () => {
                    if (window[gameName + 'Client']) {
                        gameClient = new window[gameName + 'Client']();
                        const container = document.getElementById('gameContent');
                        gameClient.render(container, gameAction);
                    } else {
                        showNotification('Ошибка загрузки игры', 'error');
                    }
                };
                script.onerror = () => {
                    // Если скрипт не загрузился, показываем заглушку
                    document.getElementById('gameContent').innerHTML = `
                        <div style="text-align:center;padding:40px;">
                            <div style="font-size:48px;margin-bottom:20px;">🎮</div>
                            <h3>Игра: ${gameName}</h3>
                            <p style="color:#999;margin-top:10px;">Загрузка игры...</p>
                        </div>
                    `;
                };
                document.head.appendChild(script);
            } catch (e) {
                console.error('Error loading game client:', e);
                document.getElementById('gameContent').innerHTML = `
                    <div style="text-align:center;padding:40px;">
                        <div style="font-size:48px;margin-bottom:20px;">⚠️</div>
                        <h3>Ошибка загрузки игры</h3>
                        <p style="color:#999;margin-top:10px;">Попробуйте перезайти в лобби</p>
                    </div>
                `;
            }
        }

        // Остальные функции (renderLobbies, renderSearchResults, searchLobbies, resetSearch, refreshLobbies, joinByCode, joinLobby, createLobby, leaveLobby, startGame, showLobbyView, updateLobbyView, showMainMenu, showCreateLobby, hideCreateLobby, toggleCodeVisibility, copyLobbyCode, leaveGame, showNotification) остаются без изменений из предыдущей версии

        function renderLobbies(lobbies) {
            const grid = document.getElementById('lobbyGrid');
            if (!lobbies || lobbies.length === 0) {
                grid.innerHTML = '<p style="text-align:center;color:#999;padding:40px;">Нет доступных лобби</p>';
                return;
            }

            grid.innerHTML = lobbies.map(lobby => `
                <div class="lobby-card" onclick="joinLobby(${lobby.id})">
                    <h3>${lobby.name}</h3>
                    <div class="lobby-info">👥 ${lobby.currentPlayers}/${lobby.maxPlayers}</div>
                    <div class="lobby-info">${lobby.isPrivate ? '🔒 Закрыто' : '🔓 Открыто'}</div>
                    <div class="lobby-info">🎮 ${lobby.gameMode || 'Без режима'}</div>
                    <span class="lobby-status ${lobby.currentPlayers === lobby.maxPlayers ? 'status-full' : lobby.isPrivate ? 'status-private' : 'status-open'}">
                        ${lobby.currentPlayers === lobby.maxPlayers ? 'Заполнено' : lobby.isPrivate ? 'По коду' : 'Открыто'}
                    </span>
                </div>
            `).join('');
        }

        function renderSearchResults(data) {
            const grid = document.getElementById('lobbyGrid');
            if (!data.lobbies || data.lobbies.length === 0) {
                grid.innerHTML = '<p style="text-align:center;color:#999;padding:40px;">Лобби не найдены</p>';
                return;
            }

            renderLobbies(data.lobbies);
            
            const totalPages = Math.ceil(data.total / 15);
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';
            
            for (let i = 0; i < totalPages; i++) {
                const btn = document.createElement('button');
                btn.textContent = i + 1;
                btn.className = i === data.page ? 'active' : '';
                btn.onclick = () => {
                    currentPage = i;
                    searchLobbies();
                };
                pagination.appendChild(btn);
            }
        }

        function searchLobbies() {
            const query = document.getElementById('searchInput').value;
            currentSearchQuery = query;
            currentPage = 0;
            
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'searchLobbies',
                    query: query,
                    page: currentPage
                }));
            }
        }

        function resetSearch() {
            document.getElementById('searchInput').value = '';
            currentSearchQuery = '';
            currentPage = 0;
            refreshLobbies();
        }

        function refreshLobbies() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'searchLobbies',
                    query: '',
                    page: 0
                }));
            }
        }

        function joinByCode() {
            const code = document.getElementById('joinCodeInput').value.trim().toUpperCase();
            if (!code) {
                showNotification('Введите код', 'error');
                return;
            }
            
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'joinByCode',
                    code: code
                }));
                document.getElementById('joinCodeInput').value = '';
            }
        }

        function joinLobby(lobbyId) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                showNotification('Нет соединения с сервером', 'error');
                return;
            }

            ws.send(JSON.stringify({
                type: 'joinLobby',
                lobbyId: lobbyId
            }));
        }

        function createLobby() {
            const name = document.getElementById('lobbyNameInput').value.trim();
            const maxPlayers = document.getElementById('maxPlayersInput').value;
            const isPrivate = document.getElementById('isPrivateInput').checked;
            const gameMode = document.getElementById('gameModeSelect').value;

            if (!name) {
                showNotification('Введите название лобби', 'error');
                return;
            }

            if (!ws || ws.readyState !== WebSocket.OPEN) {
                showNotification('Нет соединения с сервером', 'error');
                return;
            }

            ws.send(JSON.stringify({
                type: 'createLobby',
                lobbyName: name,
                maxPlayers: maxPlayers,
                isPrivate: isPrivate,
                gameMode: gameMode
            }));

            hideCreateLobby();
        }

        function leaveLobby() {
            if (confirm('Вы уверены, что хотите выйти из лобби?')) {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: 'leaveLobby'
                    }));
                }
            }
        }

        function startGame() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'startGame'
                }));
            }
        }

        function showLobbyView(lobby) {
            document.getElementById('mainMenu').classList.remove('active');
            document.getElementById('createLobby').classList.remove('active');
            document.getElementById('gameView').classList.remove('active');
            document.getElementById('lobbyView').classList.add('active');
            updateLobbyView(lobby);
        }

        function updateLobbyView(lobby) {
            document.getElementById('lobbyTitle').textContent = lobby.name;
            document.getElementById('playerCount').textContent = lobby.currentPlayers;
            document.getElementById('maxPlayerCount').textContent = lobby.maxPlayers;

            const codeDisplay = document.getElementById('lobbyCodeDisplay');
            if (lobby.isPrivate && lobby.code) {
                codeDisplay.style.display = 'flex';
                document.getElementById('codeValue').textContent = lobby.code;
                codeVisible = true;
                document.getElementById('hideCodeBtn').textContent = '👁️';
            } else {
                codeDisplay.style.display = 'none';
            }

            const grid = document.getElementById('playersGrid');
            grid.innerHTML = lobby.players.map(player => `
                <div class="player-card">
                    <div>${player.name}</div>
                    ${player.isCreator ? '<div class="creator-badge">👑 Создатель</div>' : ''}
                </div>
            `).join('');

            const startBtn = document.getElementById('startGameBtn');
            if (lobby.creatorId === currentPlayerId && lobby.currentPlayers >= 2) {
                startBtn.style.display = 'inline-block';
                startBtn.disabled = lobby.isGameStarted;
                startBtn.textContent = lobby.isGameStarted ? 'Игра началась!' : '▶️ Начать игру';
            } else {
                startBtn.style.display = 'none';
            }
        }

        function showMainMenu() {
            document.getElementById('lobbyView').classList.remove('active');
            document.getElementById('gameView').classList.remove('active');
            document.getElementById('createLobby').classList.remove('active');
            document.getElementById('mainMenu').classList.add('active');
            refreshLobbies();
            gameClient = null;
        }

        function showCreateLobby() {
            document.getElementById('mainMenu').classList.remove('active');
            document.getElementById('lobbyView').classList.remove('active');
            document.getElementById('gameView').classList.remove('active');
            document.getElementById('createLobby').classList.add('active');
        }

        function hideCreateLobby() {
            document.getElementById('createLobby').classList.remove('active');
            document.getElementById('mainMenu').classList.add('active');
        }

        function toggleCodeVisibility() {
            const codeElement = document.getElementById('codeValue');
            const hideBtn = document.getElementById('hideCodeBtn');
            
            codeVisible = !codeVisible;
            if (codeVisible) {
                codeElement.textContent = '------';
                hideBtn.textContent = '👁️';
            } else {
                codeElement.textContent = '●●●●●●';
                hideBtn.textContent = '🔒';
            }
        }

        function copyLobbyCode() {
            const code = document.getElementById('codeValue').textContent;
            if (code && code !== '●●●●●●') {
                navigator.clipboard.writeText(code).then(() => {
                    showNotification('Код скопирован!', 'success');
                }).catch(() => {
                    const textarea = document.createElement('textarea');
                    textarea.value = code;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    showNotification('Код скопирован!', 'success');
                });
            }
        }

        function leaveGame() {
            if (confirm('Вы уверены, что хотите выйти из игры?')) {
                document.getElementById('gameView').classList.remove('active');
                showMainMenu();
                if (ws && ws.readyState === WebSocket.OPEN && currentLobbyId) {
                    ws.send(JSON.stringify({
                        type: 'leaveLobby'
                    }));
                }
            }
        }

        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.style.opacity = '0';
                notification.style.transform = 'translateX(100%)';
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }

        // Периодическое обновление
        setInterval(() => {
            if (currentLobbyId && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'getLobbyInfo'
                }));
            }
        }, 5000);

        // Нажмите Enter для поиска
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchLobbies();
        });

        document.getElementById('joinCodeInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') joinByCode();
        });
    </script>
</body>
</html>
